<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#08101d">
  <title>DAG Studio</title>
  <link rel="stylesheet" href="./src/style.css?v=20260906-2">
</head>
<body>
  <div id="boot-status" class="boot-status">Uruchamianie DAG Studio…</div>
  <div id="app"></div>
  <script>
    (function () {
      var started = false;
      var status = document.getElementById('boot-status');
      function showError(text) {
        if (!status) return;
        status.textContent = text;
        status.className = 'boot-error';
      }
      window.addEventListener('error', function (event) {
        showError('Błąd JavaScript: ' + (event.message || 'nieznany błąd'));
      });
      function bootApp() {
        if (started) return;
        started = true;
        var app = document.createElement('script');
        app.src = './src/main.js?v=20260906-2';
        app.onerror = function () { showError('Nie udało się załadować ./src/main.js'); };
        document.body.appendChild(app);
      }
      function fallbackVue() {
        var vue = document.createElement('script');
        vue.src = 'https://unpkg.com/vue@3.5.42/dist/vue.global.prod.js';
        vue.onload = function () { if (window.Vue) bootApp(); else showError('UNPKG załadowany, ale Vue nie jest dostępne.'); };
        vue.onerror = function () { showError('Nie udało się załadować Vue z jsDelivr ani UNPKG.'); };
        document.head.appendChild(vue);
      }
      var vue = document.createElement('script');
      vue.src = 'https://cdn.jsdelivr.net/npm/vue@3.5.42/dist/vue.global.prod.js';
      vue.onload = function () { if (window.Vue) bootApp(); else fallbackVue(); };
      vue.onerror = fallbackVue;
      document.head.appendChild(vue);
      setTimeout(function () {
        if (!window.Vue && !started) showError('Ładowanie Vue trwa zbyt długo. Sprawdź dostęp do CDN.');
      }, 8000);
    })();
  </script>
</body>
</html>
