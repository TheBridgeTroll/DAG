<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAG Studio</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#07111f;color:#dce7f5}button,input,select,textarea{font:inherit;color:inherit;background:#101d2e;border:1px solid #29405c;border-radius:7px;padding:8px}button{cursor:pointer}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:16px;background:#0a1626}.side h2{margin:0 0 18px}.side button{width:100%;margin:4px 0;text-align:left}.main{min-width:0}.top{height:58px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #21344c}.top b{margin-right:auto}.page{padding:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1a2b;border:1px solid #21344c;border-radius:10px;padding:14px}.card strong{font-size:26px;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.designer{display:grid;grid-template-columns:180px 1fr 240px;height:calc(100vh - 58px)}.panel{padding:12px;border-right:1px solid #21344c;overflow:auto}.panel:last-child{border:0;border-left:1px solid #21344c}.canvas{position:relative;overflow:hidden;background-image:radial-gradient(#203750 1px,transparent 1px);background-size:20px 20px}.world{position:absolute;inset:0;transform-origin:0 0}.node{position:absolute;width:180px;background:#10243a;border:1px solid #34597c;border-radius:10px;padding:12px;user-select:none}.node.sel{outline:2px solid #55a7ff}.node small{display:block;color:#8fa8c2}.port{width:12px;height:12px;border-radius:50%;padding:0;background:#55a7ff}.ports{display:flex;justify-content:space-between;margin-top:10px}.toolbar{position:absolute;z-index:3;top:8px;left:8px;display:flex;gap:6px}.toast{position:fixed;right:16px;bottom:16px;background:#19304a;padding:10px 14px;border-radius:8px}.list button{display:block;width:100%;margin:5px 0}.editor{width:100%;min-height:420px;font-family:monospace}.status-success{color:#67e8a5}.status-failed{color:#ff8080}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px}.side h2{display:none}.side button{width:auto;white-space:nowrap}.cards{grid-template-columns:1fr 1fr}.designer{grid-template-columns:1fr;height:auto}.designer .panel{border:0}.canvas{height:520px}.panel:last-child{border:0}.top{position:sticky;top:0;background:#07111f;z-index:5}}</style></head><body><div id="app"></div><script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script><script>const {createApp}=Vue;const id=p=>p+Math.random().toString(36).slice(2,7);const cp=x=>JSON.parse(JSON.stringify(x));const mk=(name,x,y,type='python')=>({id:id('n'),name,x,y,type,status:'Idle',code:'@task\ndef '+name+'(df):\n    return df',retries:2,timeout:10});const wf=name=>({id:id('w'),name,schedule:'@daily',status:'Idle',zoom:1,px:0,py:0,nodes:[mk('read_data',80,140,'read'),mk('transform',340,140),mk('write_data',600,140,'write')],edges:[]});createApp({data(){return{route:'dashboard',user:'Owner',project:'Retail Analytics',workflows:[wf('daily_sales_pipeline'),wf('customer_segmentation')],wid:'',sel:null,drag:null,pan:null,toast:'',clip:null,resources:[{name:'raw.sales_orders',mode:'READ',wf:'daily_sales_pipeline'},{name:'warehouse.sales_daily',mode:'WRITE',wf:'daily_sales_pipeline'}],files:[{name:'daily_sales_pipeline.py',text:'# workflow\n@task\ndef transform(df):\n    return df'}],file:0,runs:[]}},computed:{W(){return this.workflows.find(w=>w.id===this.wid)||this.workflows[0]},N(){return this.W.nodes.find(n=>n.id===this.sel)}},mounted(){this.wid=this.workflows[0].id;addEventListener('pointermove',this.move);addEventListener('pointerup',this.up)},methods:{msg(x){this.toast=x;setTimeout(()=>this.toast='',1200)},addW(){let w=wf('workflow_'+(this.workflows.length+1));this.workflows.push(w);this.wid=w.id;this.route='designer'},addNode(type='python'){let n=mk(type+'_'+(this.W.nodes.length+1),120+this.W.nodes.length*30,250,type);this.W.nodes.push(n);this.sel=n.id},down(e,n){this.sel=n.id;this.drag={x:e.clientX,y:e.clientY,nx:n.x,ny:n.y}},move(e){if(this.drag&&this.N){this.N.x=this.drag.nx+(e.clientX-this.drag.x)/this.W.zoom;this.N.y=this.drag.ny+(e.clientY-this.drag.y)/this.W.zoom}if(this.pan){this.W.px=this.pan.px+e.clientX-this.pan.x;this.W.py=this.pan.py+e.clientY-this.pan.y}},up(){this.drag=null;this.pan=null},startPan(e){if(e.target.classList.contains('canvas'))this.pan={x:e.clientX,y:e.clientY,px:this.W.px,py:this.W.py}},copy(){if(!this.N)return;this.clip=cp(this.N);this.msg('Skopiowano do RAM')},paste(){if(!this.clip)return;let n=cp(this.clip);n.id=id('n');n.name+='_copy';n.x+=35;n.y+=35;this.W.nodes.push(n);this.sel=n.id},run(){let r={id:id('r'),name:this.W.name,status:'Running',log:['start '+this.W.name]};this.runs.unshift(r);this.W.status='Running';this.W.nodes.forEach(n=>n.status='Running');setTimeout(()=>{this.W.nodes.forEach(n=>n.status='Success');this.W.status=r.status='Success';r.log.push('success')},600)},scan(){this.resources=[...this.resources,{name:'analytics.generated_'+this.resources.length,mode:'WRITE',wf:this.W.name}];this.msg('Lineage przeskanowany')},addFile(){this.files.push({name:'new_'+this.files.length+'.py',text:'# RAM only'});this.file=this.files.length-1}}},template:`<div class="app"><aside class="side"><h2>DAG Studio</h2><button v-for="x in [['dashboard','Pulpit'],['workflows','Workflowy'],['designer','DAG'],['resources','Lineage'],['ide','IDE'],['runs','Runy'],['project','Projekt']]" @click="route=x[0]">{{x[1]}}</button></aside><main class="main"><header class="top"><b>{{project}} / {{route}}</b><span>RAM only</span><select v-model="user"><option>Owner</option><option>Editor</option><option>Viewer</option></select><button @click="run" :disabled="user==='Viewer'">▶ Run</button></header><section v-if="route==='dashboard'" class="page"><div class="cards"><div class="card"><strong>{{workflows.length}}</strong>workflowy</div><div class="card"><strong>{{W.nodes.length}}</strong>taski</div><div class="card"><strong>{{resources.length}}</strong>zasoby</div><div class="card"><strong>{{runs.length}}</strong>runy</div></div><div class="card" style="margin-top:12px"><h3>Prototyp w RAM</h3><p>Zmiany w DAG, IDE, lineage i runach znikają po odświeżeniu.</p></div></section><section v-if="route==='workflows'" class="page"><div class="row"><button @click="addW" :disabled="user==='Viewer'">+ Workflow</button></div><div class="card" v-for="w in workflows"><div class="row"><input v-model="w.name" :disabled="user==='Viewer'"><input v-model="w.schedule" :disabled="user==='Viewer'"><span>{{w.status}}</span><button @click="wid=w.id;route='designer'">Otwórz</button></div></div></section><section v-if="route==='designer'" class="designer"><div class="panel list"><h3>Taski</h3><button v-for="t in ['read','python','filter','join','write']" @click="addNode(t)" :disabled="user==='Viewer'">+ {{t}}</button><hr><button @click="copy">Copy</button><button @click="paste" :disabled="user==='Viewer'">Paste</button></div><div class="canvas" @pointerdown="startPan"><div class="toolbar"><select v-model="wid"><option v-for="w in workflows" :value="w.id">{{w.name}}</option></select><button @click="W.zoom=Math.max(.5,W.zoom-.1)">−</button><button @click="W.zoom=Math.min(1.5,W.zoom+.1)">+</button><button @click="W.zoom=.8;W.px=20;W.py=40">Fit</button></div><div class="world" :style="{transform:'translate('+W.px+'px,'+W.py+'px) scale('+W.zoom+')'}"><article v-for="n in W.nodes" class="node" :class="{sel:n.id===sel}" :style="{left:n.x+'px',top:n.y+'px'}" @pointerdown.stop="down($event,n)"><small>{{n.type}} · {{n.status}}</small><b>{{n.name}}</b><div class="ports"><i class="port"></i><i class="port"></i></div></article></div></div><div class="panel"><template v-if="N"><h3>Inspector</h3><input v-model="N.name" :disabled="user==='Viewer'"><label>Retries <input type="number" v-model.number="N.retries" :disabled="user==='Viewer'"></label><label>Timeout <input type="number" v-model.number="N.timeout" :disabled="user==='Viewer'"></label><textarea class="editor" style="min-height:220px" v-model="N.code" :disabled="user==='Viewer'"></textarea></template></div></section><section v-if="route==='resources'" class="page"><div class="row"><button @click="scan" :disabled="user==='Viewer'">Skanuj kod</button></div><div class="card" v-for="r in resources"><b>{{r.name}}</b> · {{r.mode}} · {{r.wf}}</div></section><section v-if="route==='ide'" class="page"><div class="row"><button @click="addFile" :disabled="user==='Viewer'">+ plik</button><button v-for="(f,i) in files" @click="file=i">{{f.name}}</button></div><textarea class="editor" v-model="files[file].text" :disabled="user==='Viewer'"></textarea></section><section v-if="route==='runs'" class="page"><div class="card" v-for="r in runs"><b>{{r.name}}</b> · <span :class="'status-'+r.status.toLowerCase()">{{r.status}}</span><pre>{{r.log.join('\n')}}</pre></div></section><section v-if="route==='project'" class="page"><div class="card"><h3>Projekt</h3><input v-model="project" :disabled="user==='Viewer'"><p>Rola: {{user}}</p><p>Stan tylko w pamięci przeglądarki.</p></div></section></main><div v-if="toast" class="toast">{{toast}}</div></div>`}).mount('#app');</script></body></html>
