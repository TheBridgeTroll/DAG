name: dag-devgui
services:
  gui:
    image: dag-devgui:dev
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${DEVGUI_BIND:-127.0.0.1}:${DEVGUI_PORT:-5173}:5173"
    environment:
      VITE_USE_POLLING: "${VITE_USE_POLLING:-false}"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync
          path: ./tests
          target: /app/tests
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./vite.config.js
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
